# Démarrage complet : docker compose up --build
#   Front : http://localhost:5173   ·   API : http://localhost:8080   ·   PostgreSQL : localhost:5432
# Identifiants de base de développement uniquement (surchargeables par un fichier .env non commité).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: presencelab
      POSTGRES_USER: ${DB_USER:-presencelab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-presencelab}
    ports:
      - "5432:5432"
    volumes:
      - donnees-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-presencelab} -d presencelab"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/presencelab
      DB_USER: ${DB_USER:-presencelab}
      DB_PASSWORD: ${DB_PASSWORD:-presencelab}
      # Migrations du schéma + données de démonstration (ENF4)
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
      CORS_ORIGINES: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  donnees-db:

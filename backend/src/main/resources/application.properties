spring.application.name=presencelab

# --- Base PostgreSQL : valeurs surchargées par les variables d'environnement (docker compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/presencelab}
spring.datasource.username=${DB_USER:presencelab}
spring.datasource.password=${DB_PASSWORD:presencelab}

# --- B5 : le schéma est créé UNIQUEMENT par Flyway, Hibernate se contente de vérifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

# --- Dates en ISO 8601 UTC ; une note décimale (12.5) est refusée, pas tronquée (RG13)
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- B4 : jamais de stack trace ni de page d'erreur Spring côté client
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

presencelab.cors.origines=${CORS_ORIGINES:http://localhost:5173}
